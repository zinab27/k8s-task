apiVersion: v1
kind: ConfigMap
metadata: { name: nginx-conf, namespace: barq-assessment }
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /var/run/nginx.pid;
    events { worker_connections 1024; }
    http {
        include /etc/nginx/mime.types;
        access_log /dev/stdout;
        upstream application_pool { server barq-app:8080 max_fails=3 fail_timeout=10s; }
        server {
            listen 80;
            location / {
                proxy_pass http://application_pool;
                proxy_connect_timeout 2s;
                proxy_read_timeout 3s;
                proxy_next_upstream error timeout http_502 http_503;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nginx, namespace: barq-assessment }
spec:
  replicas: 2
  selector: { matchLabels: { app: nginx } }
  template:
    metadata: { labels: { app: nginx } }
    spec:
      containers:
      - name: nginx
        image: nginx:1.28-alpine
        ports: [{ containerPort: 80 }]
        volumeMounts: [{ name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf }]
      volumes:
      - { name: conf, configMap: { name: nginx-conf } }
---
apiVersion: v1
kind: Service
metadata: { name: nginx, namespace: barq-assessment }
spec:
  type: NodePort
  selector: { app: nginx }
  ports: [{ port: 80, targetPort: 80, nodePort: 30080 }]
