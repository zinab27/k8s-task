apiVersion: apps/v1
kind: Deployment
metadata: { name: barq-app, namespace: barq-assessment }
spec:
  replicas: 3
  selector: { matchLabels: { app: barq-app } }
  template:
    metadata: { labels: { app: barq-app } }
    spec:
      containers:
      - name: app
        image: docker.io/zinabelamir/barq-app:latest
    	imagePullPolicy: IfNotPresent
        ports: [{ containerPort: 8080 }]
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
        - { name: APP_HOST, value: "0.0.0.0" }
        - { name: APP_PORT, value: "8080" }
        - { name: APP_MESSAGE, value: "Welcome to BARQ Systems" }
        - { name: DATABASE_URL, value: "postgresql://barq_app:$(POSTGRES_PASSWORD)@postgres:5432/barq_tasks" }
        - { name: REDIS_URL, value: "redis://redis:6379/0" }
        - name: INSTANCE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
        readinessProbe: { httpGet: { path: /ready, port: 8080 }, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: barq-app, namespace: barq-assessment }
spec: { selector: { app: barq-app }, ports: [{ port: 8080 }] }
